name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Marmotte.ChatUi.slnx --locked-mode
      - name: Build
        run: dotnet build Marmotte.ChatUi.slnx --configuration Release --no-restore
      - name: Restore local EF tooling
        run: dotnet tool restore
      - name: Verify EF model has a migration
        env:
          ConnectionStrings__chatdb: 'Host=localhost;Database=marmotte_design;Username=design'
        run: dotnet ef migrations has-pending-model-changes --project src/Marmotte.ChatUi.Persistence.PostgreSql --configuration Release --no-build
      - name: Verify formatting and analyzers
        run: dotnet format Marmotte.ChatUi.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test --solution Marmotte.ChatUi.slnx --configuration Release --no-build --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Restore browser checks
        run: npm ci --prefix tests/browser
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Verify component sample and accessibility
        run: npm test --prefix tests/browser

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Marmotte.ChatUi.slnx --locked-mode
      - name: Build
        run: dotnet build Marmotte.ChatUi.slnx --configuration Release --no-restore
      - name: Verify Docker infrastructure and restarts
        env:
          MARMOTTE_RUN_INFRASTRUCTURE_TESTS: '1'
        run: dotnet test --project tests/Marmotte.ChatUi.Infrastructure.Tests --configuration Release --no-build --no-restore
      - name: Verify PostgreSQL repositories and authenticated persistence
        env:
          MARMOTTE_RUN_INFRASTRUCTURE_TESTS: '1'
        run: dotnet test --project tests/Marmotte.ChatUi.Web.Tests --configuration Release --no-build --no-restore
